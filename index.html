<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Attendance Login</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      display: grid;
      place-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #eef4ff, #dfe9ff);
    }
    .card {
      width: min(90%, 420px);
      background: #fff;
      padding: 28px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(22, 51, 122, 0.15);
    }
    h2 { margin: 0 0 8px; color: #1d3c9b; }
    p { margin: 0 0 20px; color: #666; }
    form { display: grid; gap: 14px; }
    input, select, button {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #dfe7ff;
      font-size: 15px;
    }
    button {
      background: #2d5cf6;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: 600;
    }
    button:hover { background: #214fe0; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Student Attendance</h2>
    <p>Login to your account</p>
    <form>
      <input type="email" placeholder="Email" />
      <input type="password" placeholder="Password" />
      <select>
        <option>Student</option>
        <option>Admin</option>
      </select>
      <button type="submit">Login</button>
    </form>
  </div>
</body>
</html>
