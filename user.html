<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Attendance</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f6f8ff;
      color: #1e1e1e;
    }
    .container {
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
    }
    h2 { color: #1d3c9b; }
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin: 20px 0;
    }
    .box {
      background: #fff;
      padding: 18px;
      border-radius: 12px;
      box-shadow: 0 8px 18px rgba(0,0,0,0.05);
    }
    .box h3 { margin: 0 0 8px; color: #555; }
    .box p { margin: 0; font-size: 28px; font-weight: 700; }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      box-shadow: 0 8px 18px rgba(0,0,0,0.05);
    }
    th, td {
      text-align: left;
      padding: 14px 16px;
      border-bottom: 1px solid #eee;
    }
    th { background: #eef4ff; }
    .present { color: green; font-weight: 700; }
    .absent { color: red; font-weight: 700; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Welcome, Rahul</h2>
    <div class="stats">
      <div class="box">
        <h3>Present</h3>
        <p>132</p>
      </div>
      <div class="box">
        <h3>Absent</h3>
        <p>12</p>
      </div>
      <div class="box">
        <h3>Attendance</h3>
        <p>92%</p>
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th>Subject</th>
          <th>Classes</th>
          <th>Attendance</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Maths</td>
          <td>40</td>
          <td>96%</td>
          <td class="present">Present</td>
        </tr>
        <tr>
          <td>DBMS</td>
          <td>30</td>
          <td>90%</td>
          <td class="present">Present</td>
        </tr>
        <tr>
          <td>Java</td>
          <td>25</td>
          <td>80%</td>
          <td class="absent">Absent</td>
        </tr>
      </tbody>
    </table>
  </div>
</body>
</html>
